[project]
name = "complex-bessel-test"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "mpmath>=1.3",
    "matplotlib>=3.10",
    "numpy>=2.0",
    "scipy>=1.14",
]

# Pin the lint rule set explicitly: the pre-commit hook runs the latest ruff
# (`uv run --with ruff`), whose default/active rules change across versions.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
